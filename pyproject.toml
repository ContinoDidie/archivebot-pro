[tool.poetry]
name = "archivebot-pro"
version = "0.2.0"
description = "ArchiveBot Pro - Telegram media archiving and backup"
authors = ["ArchiveBot Pro"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
telethon = ">=1.28,<2.0"
SQLAlchemy = ">=1.4,<2.1"
sqlalchemy-utils = ">=0.37"
toml = ">=0.10"
cryptg = ">=0.2"
raven = ">=6.10"
typer = ">=0.6"
Flask = ">=3.0,<4.0"
gunicorn = ">=21.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
