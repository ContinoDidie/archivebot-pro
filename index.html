<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>ArchiveBot Pro</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg:#0f172a;
  --card:#1e293b;
  --hover:#273548;
  --accent:#0088cc;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:rgba(255,255,255,.09);
  --green:#22c55e;
  --red:#ef4444;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body {
  background:var(--bg);
  color:var(--text);
  padding:16px;
  min-height:100vh;
}

button,input {
  font:inherit;
}

button {
  -webkit-tap-highlight-color:transparent;
}

.app {
  width:100%;
  max-width:480px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.brand {
  font-size:18px;
  font-weight:800;
}

.badge {
  font-size:11px;
  color:#38bdf8;
  background:#082f49;
  padding:6px 9px;
  border-radius:20px;
  white-space:nowrap;
}

.status {
  font-size:13px;
  color:var(--muted);
  line-height:1.5;
  margin-bottom:12px;
  overflow-wrap:anywhere;
}

.status.ok {
  color:var(--green);
}

.status.error {
  color:#fca5a5;
}

.progress {
  height:7px;
  background:#0b1220;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:12px;
}

.progress-fill {
  height:100%;
  width:0;
  background:var(--accent);
  transition:width .3s;
}

.stats {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat {
  background:#0f172a;
  padding:12px;
  border-radius:10px;
}

.stat-label {
  font-size:11px;
  color:var(--muted);
  margin-bottom:6px;
}

.stat-value {
  font-size:19px;
  font-weight:700;
  overflow-wrap:anywhere;
}

.section-title {
  font-size:15px;
  font-weight:700;
  margin-bottom:13px;
}

.categories {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.category {
  background:#0f172a;
  border:1px solid var(--border);
  border-radius:11px;
  padding:13px 9px;
  color:var(--text);
  text-align:left;
  cursor:pointer;
  font-size:13px;
  transition:background .2s,border-color .2s;
}

.category.active {
  border-color:var(--accent);
  background:#082f49;
}

.category-count {
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.explorer {
  display:none;
  border-top:1px solid var(--border);
  margin-top:15px;
  padding-top:15px;
}

.explorer.visible {
  display:block;
}

.explorer-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}

.explorer-title {
  color:#38bdf8;
  font-size:13px;
  font-weight:700;
}

.small-actions {
  display:flex;
  gap:10px;
}

.link-button {
  border:0;
  background:none;
  color:#38bdf8;
  font-size:11px;
  text-decoration:underline;
  cursor:pointer;
}

.search {
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#0f172a;
  color:white;
  outline:none;
  margin-bottom:10px;
}

.search:focus {
  border-color:var(--accent);
}

.file-list {
  display:flex;
  flex-direction:column;
  gap:7px;
  max-height:300px;
  overflow-y:auto;
}

.file-item {
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  background:#0f172a;
  border:1px solid var(--border);
  border-radius:9px;
}

.file-checkbox {
  width:18px;
  height:18px;
  accent-color:var(--accent);
  flex-shrink:0;
}

.file-info {
  flex:1;
  min-width:0;
  cursor:pointer;
}

.file-name {
  display:block;
  font-size:13px;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.file-size {
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.details-button {
  background:var(--hover);
  border:1px solid var(--border);
  color:white;
  border-radius:7px;
  padding:7px;
  cursor:pointer;
}

.download {
  width:100%;
  background:var(--accent);
  color:white;
  border:0;
  padding:15px;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.download:disabled {
  opacity:.5;
  cursor:not-allowed;
}

.secondary {
  width:100%;
  background:var(--hover);
  color:white;
  border:1px solid var(--border);
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}

.message {
  display:none;
  padding:12px;
  border-radius:9px;
  background:#0f172a;
  font-size:12px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.message.visible {
  display:block;
}

.overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.overlay.visible {
  display:flex;
}

.modal {
  width:100%;
  max-width:380px;
  max-height:85vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--accent);
  border-radius:15px;
  padding:20px;
}

.modal h3 {
  color:#38bdf8;
  font-size:16px;
  overflow-wrap:anywhere;
  margin-bottom:15px;
}

.detail {
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}

.detail span:first-child {
  color:var(--muted);
}

.detail span:last-child {
  text-align:right;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.modal .secondary {
  margin-top:15px;
}

.footer {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:8px;
}

@media(max-width:350px) {
  body {
    padding:10px;
  }

  .brand {
    font-size:15px;
  }

  .explorer-header {
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="app">

  <section class="card">
    <div class="header">
      <div class="brand">📦 ArchiveBot Pro</div>
      <div class="badge">PLAN GRATUIT</div>
    </div>

    <div id="status" class="status">
      Conectando con ArchiveBot Pro...
    </div>

    <div class="progress">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Archivos encontrados</div>
        <div id="totalFound" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Espacio utilizado</div>
        <div id="totalWeight" class="stat-value">0 MB</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      📂 Tu biblioteca
    </div>

    <div class="categories">

      <button class="category" data-category="photos">
        🖼️ Fotos
        <span class="category-count">
          <span id="count-photos">0</span> archivos
        </span>
      </button>

      <button class="category" data-category="videos">
        🎬 Vídeos
        <span class="category-count">
          <span id="count-videos">0</span> archivos
        </span>
      </button>

      <button class="category" data-category="documents">
        📄 Documentos
        <span class="category-count">
          <span id="count-documents">0</span> archivos
        </span>
      </button>

      <button class="category" data-category="audios">
        🎵 Audios
        <span class="category-count">
          <span id="count-audios">0</span> archivos
        </span>
      </button>

    </div>

    <div id="explorer" class="explorer">

      <div class="explorer-header">
        <div id="explorerTitle" class="explorer-title">
          Archivos
        </div>

        <div class="small-actions">
          <button id="selectAll" class="link-button">
            Marcar todos
          </button>

          <button id="deselectAll" class="link-button">
            Ninguno
          </button>
        </div>
      </div>

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="🔍 Buscar archivos..."
        autocomplete="off"
      >

      <div id="fileList" class="file-list"></div>

    </div>
  </section>

  <div id="message" class="message"></div>

  <button id="downloadZip" class="download" disabled>
    📥 Descargar ZIP
    (<span id="selectedCount">0</span> ítems ·
    <span id="selectedSize">0.0</span> MB)
  </button>

  <button id="refreshButton" class="secondary">
    🔄 Actualizar biblioteca
  </button>

  <div class="footer">
    ArchiveBot Pro · Tu biblioteca personal
  </div>

</div>

<div id="overlay" class="overlay">
  <div class="modal">
    <h3 id="modalName">Detalles del archivo</h3>

    <div class="detail">
      <span>ID</span>
      <span id="modalId">—</span>
    </div>

    <div class="detail">
      <span>Categoría</span>
      <span id="modalCategory">—</span>
    </div>

    <div class="detail">
      <span>Tamaño</span>
      <span id="modalSize">—</span>
    </div>

    <div class="detail">
      <span>Tipo MIME</span>
      <span id="modalMime">—</span>
    </div>

    <div class="detail">
      <span>Fecha</span>
      <span id="modalDate">—</span>
    </div>

    <button id="closeModal" class="secondary">
      Cerrar
    </button>
  </div>
</div>

<script>
"use strict";

/*
 * API oficial de ArchiveBot Pro.
 * Si la Mini App está en Render, utiliza el mismo origen.
 * Si está alojada en otro dominio, utiliza el backend de Render.
 */
const API_BASE =
  location.hostname === "archivebot-pro.onrender.com"
    ? location.origin
    : "https://archivebot-pro.onrender.com";

const CATEGORIES = [
  "photos",
  "videos",
  "documents",
  "audios"
];

const CATEGORY_NAMES = {
  photos: "Fotos",
  videos: "Vídeos",
  documents: "Documentos",
  audios: "Audios"
};

const telegram = window.Telegram?.WebApp;

let filesData = {
  photos: [],
  videos: [],
  documents: [],
  audios: []
};

let activeCategory = null;
let selectedFiles = new Map();
let currentUserId = null;
let loading = false;
let downloading = false;

const $ = id => document.getElementById(id);

function setStatus(text, type = "") {
  const element = $("status");
  element.textContent = text;
  element.className = "status" + (type ? " " + type : "");
}

function showMessage(text) {
  const element = $("message");
  element.textContent = text;
  element.classList.add("visible");
}

function hideMessage() {
  $("message").classList.remove("visible");
}

function getUserId() {
  const user = telegram?.initDataUnsafe?.user;

  if (!user?.id) {
    return null;
  }

  return String(user.id);
}

function formatSize(mb) {
  const size = Number(mb) || 0;

  if (size < 1 && size > 0) {
    return (size * 1024).toFixed(1) + " KB";
  }

  return size.toFixed(2) + " MB";
}

/*
 * Comprueba el tipo de respuesta antes de interpretar JSON.
 * Así evitamos el error confuso Unexpected token '<'.
 */
async function apiRequest(path, options = {}) {
  const response = await fetch(API_BASE + path, {
    ...options,
    cache: "no-store"
  });

  const contentType =
    response.headers.get("content-type") || "";

  if (!contentType.toLowerCase().includes("application/json")) {
    const text = await response.text();

    console.error(
      "Respuesta inesperada del servidor:",
      response.status,
      text.slice(0, 500)
    );

    throw new Error(
      "El servidor devolvió una página en lugar de JSON. " +
      "HTTP " + response.status +
      ". Comprueba la dirección de la API y el backend."
    );
  }

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error || "Error HTTP " + response.status
    );
  }

  return data;
}

/*
 * Recupera los archivos del usuario.
 * La autenticación del usuario debe reforzarse en el backend.
 */
async function loadFiles() {
  if (loading) return;

  loading = true;
  $("refreshButton").disabled = true;

  hideMessage();
  setStatus("Conectando con el servidor...");

  try {
    if (telegram) {
      telegram.ready();
      telegram.expand();
    }

    currentUserId = getUserId();

    if (!currentUserId) {
      throw new Error(
        "Telegram no proporcionó el ID del usuario. " +
        "Comprueba que la Mini App se abre desde su botón de menú."
      );
    }

    setStatus("Usuario detectado. Cargando biblioteca...");

    const data = await apiRequest(
      "/api/files?user_id=" +
      encodeURIComponent(currentUserId)
    );

    const normalized = {};

    for (const category of CATEGORIES) {
      if (!Array.isArray(data[category])) {
        throw new Error(
          "La respuesta de la API no contiene la categoría " +
          category + "."
        );
      }

      normalized[category] = data[category].map(file => ({
        ...file,
        id: String(file.id),
        name: String(file.name || "Archivo sin nombre"),
        size: Number(file.size) || 0
      }));
    }

    filesData = normalized;

    /*
     * Elimina selecciones de archivos que ya no existen.
     */
    const existingIds = new Set(
      CATEGORIES.flatMap(category =>
        filesData[category].map(file => file.id)
      )
    );

    for (const id of selectedFiles.keys()) {
      if (!existingIds.has(id)) {
        selectedFiles.delete(id);
      }
    }

    updateUI();

    const count = CATEGORIES.reduce(
      (sum, category) => sum + filesData[category].length,
      0
    );

    setStatus(
      count === 0
        ? "Conexión correcta. Todavía no hay archivos en esta biblioteca."
        : "Conexión correcta. Se encontraron " + count + " archivos.",
      "ok"
    );

  } catch (error) {
    console.error("Error cargando biblioteca:", error);

    setStatus("No se pudo cargar la biblioteca.", "error");
    showMessage(error.message);

  } finally {
    loading = false;
    $("refreshButton").disabled = false;
  }
}

function updateUI() {
  let totalCount = 0;
  let totalSize = 0;

  for (const category of CATEGORIES) {
    const files = filesData[category] || [];

    $("count-" + category).textContent = files.length;

    totalCount += files.length;

    files.forEach(file => {
      totalSize += Number(file.size) || 0;
    });
  }

  $("totalFound").textContent = totalCount;
  $("totalWeight").textContent = formatSize(totalSize);

  const percentage = Math.min(
    100,
    (totalSize / 500) * 100
  );

  $("progressFill").style.width = percentage + "%";

  updateSelectionSummary();

  if (activeCategory) {
    renderFiles();
  }
}

function updateSelectionSummary() {
  let totalSize = 0;

  for (const file of selectedFiles.values()) {
    totalSize += Number(file.size) || 0;
  }

  $("selectedCount").textContent = selectedFiles.size;
  $("selectedSize").textContent = totalSize.toFixed(2);

  $("downloadZip").disabled =
    selectedFiles.size === 0 || downloading;
}

function openFileDetails(file, category) {
  $("modalName").textContent = file.name;
  $("modalId").textContent = file.id;
  $("modalCategory").textContent =
    CATEGORY_NAMES[category] || category;

  $("modalSize").textContent = formatSize(file.size);
  $("modalMime").textContent =
    file.mime || "Desconocido";

  $("modalDate").textContent =
    file.date || "No disponible";

  $("overlay").classList.add("visible");
}

function renderFiles() {
  const container = $("fileList");
  container.replaceChildren();

  const files = filesData[activeCategory] || [];

  const query = $("searchInput").value
    .trim()
    .toLowerCase();

  const filtered = files.filter(file =>
    file.name.toLowerCase().includes(query)
  );

  if (filtered.length === 0) {
    const empty = document.createElement("div");

    empty.style.cssText =
      "text-align:center;padding:18px;color:#94a3b8;font-size:13px";

    empty.textContent = query
      ? "No hay resultados para esa búsqueda."
      : "No hay archivos en esta categoría.";

    container.appendChild(empty);
    return;
  }

  for (const file of filtered) {
    const item = document.createElement("div");
    item.className = "file-item";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "file-checkbox";
    checkbox.checked = selectedFiles.has(file.id);
    checkbox.setAttribute(
      "aria-label",
      "Seleccionar " + file.name
    );

    checkbox.addEventListener("change", () => {
      if (checkbox.checked) {
        selectedFiles.set(file.id, file);
      } else {
        selectedFiles.delete(file.id);
      }

      updateSelectionSummary();
    });

    const info = document.createElement("div");
    info.className = "file-info";

    const name = document.createElement("span");
    name.className = "file-name";
    name.textContent = file.name;

    const size = document.createElement("span");
    size.className = "file-size";
    size.textContent = formatSize(file.size);

    info.append(name, size);

    info.addEventListener("click", () => {
      openFileDetails(file, activeCategory);
    });

    const details = document.createElement("button");
    details.className = "details-button";
    details.textContent = "ⓘ";
    details.setAttribute("aria-label", "Ver detalles");

    details.addEventListener("click", () => {
      openFileDetails(file, activeCategory);
    });

    item.append(checkbox, info, details);
    container.appendChild(item);
  }
}

/*
 * Cambiar de categoría.
 */
document.querySelectorAll(".category").forEach(button => {
  button.addEventListener("click", () => {
    const category = button.dataset.category;

    if (activeCategory === category) {
      activeCategory = null;

      $("explorer").classList.remove("visible");

      document.querySelectorAll(".category")
        .forEach(element =>
          element.classList.remove("active")
        );

      return;
    }

    activeCategory = category;

    document.querySelectorAll(".category")
      .forEach(element =>
        element.classList.toggle(
          "active",
          element.dataset.category === category
        )
      );

    $("explorerTitle").textContent =
      CATEGORY_NAMES[category];

    $("searchInput").value = "";

    $("explorer").classList.add("visible");

    renderFiles();
  });
});

/*
 * Buscar archivos.
 */
$("searchInput").addEventListener("input", renderFiles);

/*
 * Seleccionar todos los archivos de la categoría visible.
 */
$("selectAll").addEventListener("click", () => {
  if (!activeCategory) return;

  const query = $("searchInput").value
    .trim()
    .toLowerCase();

  const files = filesData[activeCategory] || [];

  files
    .filter(file => file.name.toLowerCase().includes(query))
    .forEach(file => selectedFiles.set(file.id, file));

  renderFiles();
  updateSelectionSummary();
});

/*
 * Deseleccionar los archivos de la categoría visible.
 */
$("deselectAll").addEventListener("click", () => {
  if (!activeCategory) return;

  const query = $("searchInput").value
    .trim()
    .toLowerCase();

  const files = filesData[activeCategory] || [];

  files
    .filter(file => file.name.toLowerCase().includes(query))
    .forEach(file => selectedFiles.delete(file.id));

  renderFiles();
  updateSelectionSummary();
});

/*
 * Crear y descargar el ZIP.
 * El backend verifica que cada archivo pertenezca al usuario.
 */
$("downloadZip").addEventListener("click", async () => {
  if (downloading || selectedFiles.size === 0) {
    return;
  }

  if (selectedFiles.size > 200) {
    showMessage(
      "Puedes descargar un máximo de 200 archivos por ZIP."
    );
    return;
  }

  if (!currentUserId) {
    showMessage(
      "No se ha identificado al usuario de Telegram."
    );
    return;
  }

  downloading = true;
  updateSelectionSummary();
  hideMessage();

  const button = $("downloadZip");
  const originalText = button.textContent;

  button.textContent = "⏳ Preparando ZIP...";

  try {
    const ids = Array.from(selectedFiles.keys());

    const response = await fetch(API_BASE + "/api/zip", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        user_id: currentUserId,
        ids: ids
      }),
      cache: "no-store"
    });

    const contentType =
      response.headers.get("content-type") || "";

    if (!response.ok) {
      if (contentType.includes("application/json")) {
        const data = await response.json();

        throw new Error(
          data.error || "No se pudo crear el ZIP."
        );
      }

      throw new Error(
        "El servidor rechazó la descarga. HTTP " +
        response.status
      );
    }

    if (!contentType.includes("application/zip") &&
        !contentType.includes("application/octet-stream")) {
      throw new Error(
        "El servidor no devolvió un archivo ZIP válido."
      );
    }

    const blob = await response.blob();

    if (blob.size === 0) {
      throw new Error("El ZIP recibido está vacío.");
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "ArchiveBot_Pro.zip";
    link.style.display = "none";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 60000);

    setStatus(
      "ZIP preparado correctamente. Comprueba las descargas.",
      "ok"
    );

  } catch (error) {
    console.error("Error descargando ZIP:", error);

    showMessage(
      "No se pudo descargar el ZIP: " + error.message
    );

  } finally {
    downloading = false;
    button.textContent = originalText;
    updateSelectionSummary();
  }
});

/*
 * Cerrar modal.
 */
$("closeModal").addEventListener("click", () => {
  $("overlay").classList.remove("visible");
});

$("overlay").addEventListener("click", event => {
  if (event.target === $("overlay")) {
    $("overlay").classList.remove("visible");
  }
});

/*
 * Actualizar biblioteca.
 */
$("refreshButton").addEventListener("click", loadFiles);

/*
 * Inicialización: una única carga de archivos.
 */
if (telegram) {
  telegram.ready();
  telegram.expand();
}

loadFiles();
</script>

</body>
</html>
