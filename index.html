<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchiveBot Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #273548;
      --accent-color: #0088cc;
      --accent-hover: #0077b5;
      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --success-color: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    .status-card, .section-card, .limit-card { background: var(--card-bg); border-radius: 14px; padding: 16px; border: 1px solid var(--border-color); }
    .status-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .bot-title { font-size: 1.1rem; font-weight: 700; }
    .plan-badge { background: rgba(0, 136, 204, 0.15); color: var(--accent-color); font-size: 0.75rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
    .status-text { font-size: 0.9rem; color: var(--success-color); margin-bottom: 8px; font-weight: 500; }
    .progress-bar-bg { background: #0f172a; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar-fill { background: var(--accent-color); height: 100%; width: 100%; border-radius: 4px; }
    .status-details { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-secondary); }
    .section-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; }
    
    /* Grid de Carpetas Dinámicas */
    .folders-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .folder-btn { background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s ease; text-align: left; }
    .folder-btn:hover { background: var(--card-hover); border-color: var(--accent-color); }
    .folder-btn.active { border-color: var(--accent-color); background: rgba(0, 136, 204, 0.1); }

    .file-explorer { display: none; margin-top: 14px; border-top: 1px solid var(--border-color); paddingTop: 14px; }
    .file-explorer.visible { display: block; }
    .explorer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .explorer-title { font-size: 0.85rem; font-weight: 600; color: var(--accent-color); }
    .action-link { background: none; border: none; color: var(--text-secondary); font-size: 0.75rem; cursor: pointer; text-decoration: underline; }
    
    .search-box { position: relative; margin-bottom: 10px; }
    .search-input { width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px 8px 32px; color: var(--text-main); font-size: 0.85rem; outline: none; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; color: var(--text-secondary); }

    .file-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
    .file-item { display: flex; align-items: center; background: #0f172a; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); }
    .file-checkbox { margin-right: 10px; accent-color: var(--accent-color); width: 16px; height: 16px; cursor: pointer; }
    .file-info { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
    .file-name { font-size: 0.8rem; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-size { font-size: 0.7rem; color: var(--text-secondary); }

    .btn-download { background: var(--accent-color); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
    .limit-text { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 10px; text-align: center; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="status-card">
      <div class="status-header">
        <div class="bot-title">📦 ArchiveBot Pro</div>
        <span class="plan-badge">Plan Gratuito</span>
      </div>
      <div class="status-text">✅ Sincronizado con Telegram</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
      <div class="status-details">
        <span>Archivos encontrados: <strong id="totalFound">0</strong></span>
        <span>Tamaño total: <strong id="totalWeight">0.0 MB</strong></span>
      </div>
    </div>

    <!-- Sección de Carpetas Dinámicas -->
    <div class="section-card">
      <div class="section-title">📁 Tus Carpetas y Respaldos</div>
      
      <div id="foldersGrid" class="folders-grid">
        <!-- Se cargan dinámicamente desde el backend -->
      </div>

      <div id="fileExplorer" class="file-explorer">
        <div class="explorer-header">
          <span class="explorer-title" id="explorerFolderTitle">Contenido de la carpeta</span>
          <div class="explorer-actions">
            <button class="action-link" id="selectAllCategory">Marcar todos</button>
            <button class="action-link" id="deselectAllCategory">Ninguno</button>
          </div>
        </div>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="fileSearchInput" class="search-input" placeholder="Buscar archivo en carpeta...">
        </div>

        <div id="fileListContainer" class="file-list"></div>
      </div>
    </div>

    <button id="btnDownloadZip" class="btn-download">
      📥 Descargar ZIP (<span id="selectedCount">0</span> ítems • <span id="selectedSize">0.0</span> MB)
    </button>
  </div>

  <script>
    let userFoldersData = {};
    let activeFolder = null;
    let selectedFilesMap = new Map();

    const foldersGrid = document.getElementById('foldersGrid');
    const fileExplorer = document.getElementById('fileExplorer');
    const explorerFolderTitle = document.getElementById('explorerFolderTitle');
    const fileListContainer = document.getElementById('fileListContainer');
    const fileSearchInput = document.getElementById('fileSearchInput');
    const totalFoundEl = document.getElementById('totalFound');
    const totalWeightEl = document.getElementById('totalWeight');
    const selectedCountEl = document.getElementById('selectedCount');
    const selectedSizeEl = document.getElementById('selectedSize');

    // Obtener datos reales desde el backend en Render
    async function fetchUserData() {
      try {
        // Obtenemos el ID del usuario de Telegram si está disponible en la MiniApp
        let userId = 'default_user';
        if (window.Telegram && window.Telegram.WebApp.initDataUnsafe?.user?.id) {
          userId = window.Telegram.WebApp.initDataUnsafe.user.id;
        }

        const response = await fetch(`/api/files?user_id=${userId}`);
        userFoldersData = await response.json();
        
        renderFolders();
        updateGlobalStats();
      } catch (err) {
        console.error("Error al obtener datos del servidor:", err);
      }
    }

    function renderFolders() {
      foldersGrid.innerHTML = '';
      const folderNames = Object.keys(userFoldersData);

      if (folderNames.length === 0) {
        foldersGrid.innerHTML = `<div style="grid-column: span 2; font-size: 0.8rem; color: #94a3b8; text-align: center;">No hay carpetas. Envía archivos al bot.</div>`;
        return;
      }

      folderNames.forEach(folderName => {
        const fileCount = userFoldersData[folderName].length;
        const btn = document.createElement('button');
        btn.className = `folder-btn ${activeFolder === folderName ? 'active' : ''}`;
        btn.innerHTML = `<span>📂</span> ${folderName} (${fileCount})`;
        
        btn.addEventListener('click', () => {
          if (activeFolder === folderName) {
            fileExplorer.classList.remove('visible');
            btn.classList.remove('active');
            activeFolder = null;
            return;
          }

          document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          activeFolder = folderName;
          explorerFolderTitle.textContent = `Carpeta: ${folderName}`;
          fileSearchInput.value = '';
          renderFileList(userFoldersData[folderName]);
          fileExplorer.classList.add('visible');
        });

        foldersGrid.appendChild(btn);
      });
    }

    function renderFileList(filesArray, filterText = '') {
      fileListContainer.innerHTML = '';
      const filtered = filesArray.filter(file => file.name.toLowerCase().includes(filterText.toLowerCase()));

      if (filtered.length === 0) {
        fileListContainer.innerHTML = `<div style="font-size: 0.8rem; color: #94a3b8; text-align: center; padding: 10px;">Carpeta vacía</div>`;
        return;
      }

      filtered.forEach(file => {
        const isChecked = selectedFilesMap.has(file.id);
        const item = document.createElement('label');
        item.className = 'file-item';
        item.innerHTML = `
          <input type="checkbox" class="file-checkbox" value="${file.id}" ${isChecked ? 'checked' : ''} />
          <div class="file-info">
            <span class="file-name" title="${file.name}">${file.name}</span>
            <span class="file-size">${file.size} MB</span>
          </div>
        `;

        item.querySelector('input').addEventListener('change', (e) => {
          if (e.target.checked) {
            selectedFilesMap.set(file.id, { name: file.name, size: file.size });
          } else {
            selectedFilesMap.delete(file.id);
          }
          updateGlobalSummary();
        });

        fileListContainer.appendChild(item);
      });
    }

    function updateGlobalStats() {
      let totalCount = 0;
      let totalWeightNum = 0;
      Object.keys(userFoldersData).forEach(folder => {
        userFoldersData[folder].forEach(file => {
          totalCount++;
          totalWeightNum += file.size;
        });
      });
      totalFoundEl.textContent = totalCount;
      totalWeightEl.textContent = totalWeightNum.toFixed(1) + ' MB';
    }

    function updateGlobalSummary() {
      let count = selectedFilesMap.size;
      let totalMB = 0;
      selectedFilesMap.forEach(file => { totalMB += file.size; });
      selectedCountEl.textContent = count;
      selectedSizeEl.textContent = totalMB.toFixed(1);
    }

    fileSearchInput.addEventListener('input', (e) => {
      if (!activeFolder) return;
      renderFileList(userFoldersData[activeFolder], e.target.value);
    });

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Cargar datos al iniciar
    fetchUserData();
  </script>
</body>
</html>
