<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchiveBot Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #273548;
      --accent-color: #0088cc;
      --accent-hover: #0077b5;
      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --success-color: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

    .status-card, .section-card, .limit-card { background: var(--card-bg); border-radius: 14px; padding: 16px; border: 1px solid var(--border-color); }
    .status-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .bot-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .plan-badge { background: rgba(0, 136, 204, 0.15); color: var(--accent-color); font-size: 0.75rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
    .status-text { font-size: 0.9rem; color: var(--success-color); margin-bottom: 8px; font-weight: 500; }
    .progress-bar-bg { background: #0f172a; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar-fill { background: var(--accent-color); height: 100%; width: 100%; border-radius: 4px; }
    .status-details { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-secondary); }

    .section-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; color: var(--text-main); }
    .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .category-btn { background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s ease; text-align: left; }
    .category-btn:hover { background: var(--card-hover); border-color: var(--accent-color); }
    .category-btn.active { border-color: var(--accent-color); background: rgba(0, 136, 204, 0.1); }

    .file-explorer { display: none; margin-top: 14px; border-top: 1px solid var(--border-color); padding-top: 14px; }
    .file-explorer.visible { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    .explorer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .explorer-title { font-size: 0.85rem; font-weight: 600; color: var(--accent-color); }
    .action-link { background: none; border: none; color: var(--text-secondary); font-size: 0.75rem; cursor: pointer; text-decoration: underline; }

    .search-box { position: relative; margin-bottom: 10px; }
    .search-input { width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px 8px 32px; color: var(--text-main); font-size: 0.85rem; outline: none; }
    .search-input:focus { border-color: var(--accent-color); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; color: var(--text-secondary); }

    .file-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
    .file-item { display: flex; align-items: center; background: #0f172a; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer; }
    .file-item:hover { background: var(--card-hover); }
    .file-checkbox { margin-right: 10px; accent-color: var(--accent-color); width: 16px; height: 16px; cursor: pointer; }
    .file-info { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
    .file-name { font-size: 0.8rem; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-size { font-size: 0.7rem; color: var(--text-secondary); }

    .btn-download { background: var(--accent-color); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3); }

    /* Estilos del Modal / Ventana Emergente */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 999; justify-content: center; align-items: center; padding: 16px; }
    .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 16px; width: 100%; max-width: 360px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 12px; }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--accent-color); word-break: break-all; }
    .modal-detail { font-size: 0.82rem; color: var(--text-secondary); display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    .modal-detail span { color: var(--text-main); font-weight: 500; }
    .btn-close-modal { background: var(--card-hover); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="status-card">
      <div class="status-header">
        <div class="bot-title">📦 ArchiveBot Pro</div>
        <span class="plan-badge">Plan Gratuito</span>
      </div>
      <div class="status-text">✅ ¡Escaneo completado!</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
      <div class="status-details">
        <span>Archivos encontrados: <strong id="totalFound">0</strong></span>
        <span>Tamaño total: <strong id="totalWeight">0.0 MB</strong></span>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">🎯 ¿Qué categoría deseas explorar y respaldar?</div>
      
      <div class="categories-grid">
        <button class="category-btn" data-category="photos"><span>🖼️</span> Fotos (<span id="count-photos">0</span>)</button>
        <button class="category-btn" data-category="videos"><span>🎥</span> Videos (<span id="count-videos">0</span>)</button>
        <button class="category-btn" data-category="documents"><span>📄</span> Documentos (<span id="count-documents">0</span>)</button>
        <button class="category-btn" data-category="audios"><span>🎵</span> Audios (<span id="count-audios">0</span>)</button>
      </div>

      <div id="fileExplorer" class="file-explorer">
        <div class="explorer-header">
          <span class="explorer-title" id="explorerCategoryTitle">Archivos de la categoría</span>
          <div class="explorer-actions">
            <button class="action-link" id="selectAllCategory">Marcar todos</button>
            <button class="action-link" id="deselectAllCategory">Ninguno</button>
          </div>
        </div>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="fileSearchInput" class="search-input" placeholder="Buscar por nombre de archivo...">
        </div>

        <div id="fileListContainer" class="file-list"></div>
      </div>
    </div>

    <button id="btnDownloadZip" class="btn-download">
      📥 Descargar ZIP (<span id="selectedCount">0</span> ítems • <span id="selectedSize">0.0</span> MB)
    </button>

  </div>

  <!-- Modal Emergente de Detalles -->
  <div id="fileModal" class="modal-overlay">
    <div class="modal-card">
      <div id="modalFileName" class="modal-title">Nombre_Archivo.jpg</div>
      <div class="modal-detail">ID: <span id="modalFileId">--</span></div>
      <div class="modal-detail">Categoría: <span id="modalFileCategory">--</span></div>
      <div class="modal-detail">Tamaño: <span id="modalFileSize">-- MB</span></div>
      <div class="modal-detail">Tipo MIME: <span id="modalFileMime">--</span></div>
      <div class="modal-detail">Fecha: <span id="modalFileDate">--</span></div>
      <button class="btn-close-modal" id="btnCloseModal">Cerrar Detalle</button>
    </div>
  </div>

  <script>
    let filesData = { photos: [], videos: [], documents: [], audios: [] };
    let activeCategory = null;
    let selectedFilesMap = new Map();

    const categoryButtons = document.querySelectorAll('.category-btn');
    const fileExplorer = document.getElementById('fileExplorer');
    const explorerCategoryTitle = document.getElementById('explorerCategoryTitle');
    const fileListContainer = document.getElementById('fileListContainer');
    const fileSearchInput = document.getElementById('fileSearchInput');
    
    const fileModal = document.getElementById('fileModal');
    const btnCloseModal = document.getElementById('btnCloseModal');

    async function fetchRealFiles() {
      try {
        let userId = 'default_user';
        if (window.Telegram && window.Telegram.WebApp.initDataUnsafe?.user?.id) {
          userId = window.Telegram.WebApp.initDataUnsafe.user.id;
        }

        const response = await fetch(`/api/files?user_id=${userId}`);
        const data = await response.json();
        filesData = data;
        updateUI();
      } catch (err) {
        console.error("Error cargando archivos del servidor:", err);
      }
    }

    function updateUI() {
      let totalCount = 0;
      let totalWeightNum = 0;

      ['photos', 'videos', 'documents', 'audios'].forEach(cat => {
        const arr = filesData[cat] || [];
        document.getElementById(`count-${cat}`).textContent = arr.length;
        totalCount += arr.length;
        arr.forEach(f => totalWeightNum += f.size);
      });

      document.getElementById('totalFound').textContent = totalCount;
      document.getElementById('totalWeight').textContent = totalWeightNum.toFixed(1) + ' MB';

      if (activeCategory) {
        renderFileList(filesData[activeCategory] || [], fileSearchInput.value);
      }
    }

    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const categoryKey = btn.getAttribute('data-category');
        if (activeCategory === categoryKey) {
          fileExplorer.classList.remove('visible');
          btn.classList.remove('active');
          activeCategory = null;
          return;
        }

        categoryButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        activeCategory = categoryKey;
        explorerCategoryTitle.textContent = `Archivos en: ${btn.textContent.trim().split(' ')[0]} ${btn.textContent.trim().split(' ')[1]}`;
        fileSearchInput.value = '';
        renderFileList(filesData[categoryKey] || []);
        fileExplorer.classList.add('visible');
      });
    });

    function renderFileList(filesArray, filterText = '') {
      fileListContainer.innerHTML = '';
      const filtered = filesArray.filter(file => file.name.toLowerCase().includes(filterText.toLowerCase()));

      if (filtered.length === 0) {
        fileListContainer.innerHTML = `<div style="font-size: 0.8rem; color: #94a3b8; text-align: center; padding: 10px;">No hay archivos en esta categoría</div>`;
        return;
      }

      filtered.forEach(file => {
        const isChecked = selectedFilesMap.has(file.id);
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <input type="checkbox" class="file-checkbox" value="${file.id}" ${isChecked ? 'checked' : ''} />
          <div class="file-info">
            <span class="file-name" title="${file.name}">${file.name}</span>
            <span class="file-size">${file.size} MB</span>
          </div>
        `;

        // Checkbox para selección de ZIP
        const checkbox = item.querySelector('.file-checkbox');
        checkbox.addEventListener('click', (e) => {
          e.stopPropagation(); // Evitar abrir la modal al tocar la casilla
          if (checkbox.checked) {
            selectedFilesMap.set(file.id, { name: file.name, size: file.size });
          } else {
            selectedFilesMap.delete(file.id);
          }
          updateGlobalSummary();
        });

        // Tocar el cuerpo del archivo despliega la modal con los detalles
        item.querySelector('.file-info').addEventListener('click', () => {
          openFileModal(file);
        });

        fileListContainer.appendChild(item);
      });
    }

    function openFileModal(file) {
      document.getElementById('modalFileName').textContent = file.name;
      document.getElementById('modalFileId').textContent = file.id || 'N/A';
      document.getElementById('modalFileCategory').textContent = activeCategory || 'N/A';
      document.getElementById('modalFileSize').textContent = `${file.size} MB`;
      document.getElementById('modalFileMime').textContent = file.mime || 'Desconocido';
      document.getElementById('modalFileDate').textContent = file.date || 'Reciente';

      fileModal.classList.add('active');
    }

    btnCloseModal.addEventListener('click', () => {
      fileModal.classList.remove('active');
    });

    fileSearchInput.addEventListener('input', (e) => {
      if (!activeCategory) return;
      renderFileList(filesData[activeCategory] || [], e.target.value);
    });

    function updateGlobalSummary() {
      let count = selectedFilesMap.size;
      let totalMB = 0;
      selectedFilesMap.forEach(file => { totalMB += file.size; });
      document.getElementById('selectedCount').textContent = count;
      document.getElementById('selectedSize').textContent = totalMB.toFixed(1);
    }

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    fetchRealFiles();
  </script>
</body>
</html>
